# Giữ dự án Supabase bậc miễn phí hoạt động: 7 ngày không có truy vấn thì Supabase tạm dừng dự án.
# Mỗi 2 ngày gọi truy vấn nhẹ tới Auth và PostgREST (Postgres). Khoá lấy từ GitHub Secrets.
name: Keep Supabase Alive

on:
  schedule:
    - cron: '17 1 */2 * *'   # 01:17 UTC, cách 2 ngày
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping Supabase Auth và Postgres (kèm dự phòng DNS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Chưa đặt secret SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY, bỏ qua."
            exit 0
          fi

          base_url="${SUPABASE_URL%/}"
          host=$(printf '%s' "$base_url" | sed -E 's#^https?://([^/:]+).*#\1#')
          resolve_opt=""

          ping_endpoint() {
            local url="$1"
            set +e
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              --retry 4 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 20 \
              $resolve_opt \
              -H "apikey: $SUPABASE_KEY" \
              "$url")
            rc=$?

            if [ "$rc" -eq 6 ] && [ -z "$resolve_opt" ]; then
              ip=""
              for resolver in 1.1.1.1 8.8.8.8; do
                ip=$(dig +short @"$resolver" "$host" A 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
                [ -n "$ip" ] && break
              done
              if [ -n "$ip" ]; then
                echo "DNS mặc định lỗi, dùng DNS dự phòng cho $host -> $ip"
                resolve_opt="--resolve $host:443:$ip"
                code=$(curl -sS -o /dev/null -w '%{http_code}' \
                  --retry 3 --retry-delay 4 --retry-all-errors \
                  --connect-timeout 10 --max-time 20 \
                  $resolve_opt \
                  -H "apikey: $SUPABASE_KEY" \
                  "$url")
                rc=$?
              fi
            fi
            set -e
            echo "$url -> curl_exit=$rc HTTP=$code"
            [ "$rc" -eq 0 ] && [ "$code" = "200" ]
          }

          ping_endpoint "$base_url/auth/v1/settings"
          ping_endpoint "$base_url/rest/v1/recipes?select=id&limit=1"
