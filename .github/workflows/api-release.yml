name: API Documentation & Release Deploy

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (ví dụ: v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  # Test không qua thì không phát hành
  tests:
    uses: ./.github/workflows/backend-tests.yml

  build-and-release:
    name: Build API Specs & Publish Release
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Schema & Security Verifications
        run: |
          node supabase/scripts/run_security_audit.js

      - name: Generate OpenAPI & Documentation Artifacts
        run: |
          node supabase/scripts/generate_api_spec.js

      - name: Package API Bundle
        run: |
          cd dist/api
          zip -r ../elytra-api-bundle.zip .
          cd ../..

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            TAG="api-latest"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish API Release Asset to GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Elytra API Spec & Contract (${{ steps.release_info.outputs.tag }})"
          body: |
            ## 🚀 Elytra API Release (${{ steps.release_info.outputs.tag }})

            Tài liệu và cấu hình API chính thức được tạo tự động bởi CI/CD Pipeline.

            ### 📦 Các tệp đính kèm:
            - **`openapi.json`**: Chuẩn OpenAPI 3.0.3 định dạng JSON tương thích Postman / Swagger UI.
            - **`openapi.yaml`**: Chuẩn OpenAPI 3.0.3 định dạng YAML.
            - **`api-contract.md`**: Hợp đồng giao tiếp API chi tiết cho Mobile App & Backend.
            - **`elytra-api-bundle.zip`**: Gói nén đầy đủ tất cả tài nguyên API.

            Thay đổi theo sprint: xem `docs/week*/README.md` trong repo. Danh sách API đầy đủ: `api-contract.md` (đính kèm).
          draft: false
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          files: |
            dist/api/openapi.json
            dist/api/openapi.yaml
            dist/api/api-contract.md
            dist/elytra-api-bundle.zip
